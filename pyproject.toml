[project]
name = "pw_outpaint"
description = "PW Outpaint - a four-node outpainting toolkit for ComfyUI: interactive outpaint framing (pause, drag the new canvas, accept), pixel-perfect stitch-back, band QC metering, and frame-aware banded color matching. Built for Flux.2 Klein, Qwen Image Edit, and other inpaint/outpaint pipelines."
version = "1.1.0"
license = { file = "LICENSE" }
dependencies = []

[project.urls]
Repository = "https://github.com/Fablestarexpanse/PW_Outpaint"

[tool.comfy]
PublisherId = "fablestarexpanse"
DisplayName = "PW Outpaint"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
